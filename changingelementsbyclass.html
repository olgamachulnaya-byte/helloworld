<!DOCTYPE html>
<html>
<head>
    <title>Изменение текста элементов</title>
</head>
<body>
    <p class="description">Первый текст</p>
    <div class="description">Второй текст</div>
    <span class="description">Третий текст</span>

    <script>
        const descriptions = document.querySelectorAll('.description');
        descriptions.forEach(element => {
            element.textContent = 'Измененный текст';
        });
    </script>
</body>
</html>
